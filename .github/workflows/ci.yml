name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Python 3.9 is unavailable in the Ubuntu 26.04 toolcache currently used by
    # ubuntu-latest, so keep the compatibility job on the prior LTS image.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: flightrecorder benchmark

  mcp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[mcp]'
      - run: python -m unittest tests.test_mcp_and_benchmark.MCPProtocolSmokeTests -v
